<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>

<title>🤍</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-user-select:none;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
}

body{
  width:100%;
  min-height:100dvh;
  overflow-x:hidden;
  overflow-y:auto;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:linear-gradient(180deg,#c66a95,#f6a7c0,#ffdbe7);
  display:flex;
  justify-content:center;
  align-items:center;
  color:white;
  position:relative;
  transition:background 1s ease, transform 0.2s ease;
  touch-action:manipulation;
}

.container{
  width:100%;
  max-width:420px;
  padding:20px;
  text-align:center;
  position:relative;
  z-index:2;
}

h1{
  font-size:2.4rem;
  margin-bottom:10px;
  text-shadow:0 0 15px rgba(255,255,255,0.25);
}

.subtitle{
  font-size:1.05rem;
  opacity:0.95;
  min-height:35px;
  margin-bottom:15px;
  transition:0.4s;
}

.game-area{
  position:relative;
  width:100%;
  height:350px;
  overflow:hidden;
}

.face{
  position:absolute;
  width:150px;
  height:150px;
  border-radius:25px;
  object-fit:contain;
  background:transparent;
  border:3px solid rgba(255,255,255,0.7);
  box-shadow:0 0 25px rgba(255,255,255,0.25);
  transition:
    left 0.45s ease,
    top 0.45s ease,
    transform 0.3s ease,
    width 1s ease,
    height 1s ease,
    box-shadow 0.3s ease;
}

.face.final-face{
  width:260px !important;
  height:260px !important;
}

.reaction{
  height:30px;
  margin-top:10px;
  font-size:1rem;
  opacity:0.95;
  transition:0.3s;
}

.progress-wrap{
  width:220px;
  height:10px;
  background:rgba(255,255,255,0.25);
  border-radius:20px;
  overflow:hidden;
  margin:12px auto 0;
}

.progress{
  width:0%;
  height:100%;
  background:white;
  border-radius:20px;
  transition:0.3s ease;
}

.message{
  margin-top:20px;
  line-height:1.7;
  font-size:1rem;
  opacity:0;
  transform:translateY(15px);
  transition:all 1s ease;
}

.message.show{
  opacity:1;
  transform:translateY(0);
}

.hold-area{
  margin-top:20px;
  opacity:0;
  pointer-events:none;
  transition:1s ease;
}

.hold-area.show{
  opacity:1;
  pointer-events:auto;
}

.hold-btn{
  padding:15px 30px;
  border:none;
  border-radius:40px;
  background:rgba(255,255,255,0.18);
  color:white;
  font-size:1rem;
  backdrop-filter:blur(10px);
}

.hold-progress{
  margin-top:14px;
  width:220px;
  height:10px;
  background:rgba(255,255,255,0.2);
  border-radius:20px;
  overflow:hidden;
  margin-inline:auto;
}

.hold-fill{
  width:0%;
  height:100%;
  background:white;
  transition:0.1s linear;
}

.kiss{
  position:absolute;
  font-size:32px;
  animation:pop 0.8s ease forwards;
  pointer-events:none;
}

.sparkle{
  position:absolute;
  font-size:18px;
  animation:sparkleFloat 4s linear forwards;
  opacity:0.8;
  pointer-events:none;
}

@keyframes sparkleFloat{
  0%{
    transform:translateY(0) scale(0.5);
    opacity:0;
  }
  30%{
    opacity:1;
  }
  100%{
    transform:translateY(-80px) scale(1);
    opacity:0;
  }
}

@keyframes pop{
  0%{
    transform:scale(0.2);
    opacity:0;
  }
  50%{
    transform:scale(1.3);
    opacity:1;
  }
  100%{
    transform:translateY(-25px) scale(1);
    opacity:0;
  }
}

.heart{
  position:absolute;
  font-size:18px;
  opacity:0.6;
  animation:float 7s linear infinite;
}

@keyframes float{
  0%{
    transform:translateY(100vh);
    opacity:0;
  }
  50%{
    opacity:1;
  }
  100%{
    transform:translateY(-10vh);
    opacity:0;
  }
}

.dark-romantic{
  background:
    radial-gradient(circle at center,
    #ffb6c9 0%,
    #d27ba0 40%,
    #7a395d 100%);
}

</style>
</head>

<body>

<div class="container">

  <h1>Ammuuuu 💋</h1>

  <div class="subtitle" id="subtitle">
    Catch me first 😚
  </div>

  <div class="reaction" id="reaction"></div>

  <div class="progress-wrap">
    <div class="progress" id="progress"></div>
  </div>

  <div class="game-area" id="gameArea">

    <img
      src="kiss.png"
      id="face"
      class="face"
      draggable="false"
    />

  </div>

  <div class="message" id="message">
    Okay okay... you caught me 🤍<br><br>
    Now come closer...
  </div>

  <div class="hold-area" id="holdArea">

    <button
      class="hold-btn"
      id="holdBtn"
    >
      Hold to kiss 💋
    </button>

    <div class="hold-progress">
      <div class="hold-fill" id="holdFill"></div>
    </div>

  </div>

</div>

<script>

const face = document.getElementById("face");
const gameArea = document.getElementById("gameArea");
const progress = document.getElementById("progress");
const reaction = document.getElementById("reaction");
const subtitle = document.getElementById("subtitle");
const message = document.getElementById("message");
const holdArea = document.getElementById("holdArea");
const holdBtn = document.getElementById("holdBtn");
const holdFill = document.getElementById("holdFill");

let catches = 0;
let gameFinished = false;
let holdInterval;
let holdValue = 0;
let heartbeatInterval;

const reactions = [
  "stoppp 😳",
  "ponnuuuu 🫶",
  "you caught me 💋",
  "again again 😚",
  "you're making me blush 🤍",
  "closerrrr 😳"
];

// image error helper
face.onerror = function(){
  subtitle.innerHTML = "kiss.png not found 😭";
};

// initial move
moveFace();

// floating hearts
function createHeart(){

  const heart = document.createElement("div");

  heart.classList.add("heart");
  heart.innerHTML = "🤍";

  heart.style.left = Math.random()*100+"vw";
  heart.style.animationDuration =
    (4+Math.random()*4)+"s";

  document.body.appendChild(heart);

  setTimeout(()=>{
    heart.remove();
  },8000);
}

setInterval(createHeart,600);

// face movement
function moveFace(){

  const areaWidth = gameArea.clientWidth - 160;
  const areaHeight = gameArea.clientHeight - 160;

  const x = Math.max(0, Math.random()*areaWidth);
  const y = Math.max(0, Math.random()*areaHeight);

  face.style.left = x+"px";
  face.style.top = y+"px";
}

// kiss effect
function createKiss(x,y){

  const kiss = document.createElement("div");

  kiss.classList.add("kiss");
  kiss.innerHTML = "💋";

  kiss.style.left = x+"px";
  kiss.style.top = y+"px";

  document.body.appendChild(kiss);

  setTimeout(()=>{
    kiss.remove();
  },800);
}

// sparkle effect
function createSparkle(){

  const sparkle = document.createElement("div");

  sparkle.classList.add("sparkle");

  sparkle.innerHTML = Math.random() > 0.5 ? "✨" : "🤍";

  sparkle.style.left =
    (Math.random()*window.innerWidth)+"px";

  sparkle.style.top =
    (window.innerHeight-100)+"px";

  document.body.appendChild(sparkle);

  setTimeout(()=>{
    sparkle.remove();
  },4000);
}

// catch face
face.addEventListener("click", catchFace);
face.addEventListener("touchstart", catchFace);

function catchFace(e){

  e.preventDefault();

  if(gameFinished) return;

  catches++;

  progress.style.width = (catches*20)+"%";

  reaction.innerHTML =
    reactions[Math.floor(Math.random()*reactions.length)];

  // face blush glow
  face.style.boxShadow =
    "0 0 40px rgba(255,255,255,0.6)";

  setTimeout(()=>{
    face.style.boxShadow =
      "0 0 25px rgba(255,255,255,0.25)";
  },250);

  // slight tilt
  face.style.transform =
    `rotate(${Math.random()*12-6}deg) scale(1.08)`;

  setTimeout(()=>{
    face.style.transform = "scale(1)";
  },180);

  const rect = face.getBoundingClientRect();

  createKiss(
    rect.left + rect.width/2,
    rect.top + rect.height/2
  );

  if(navigator.vibrate){
    navigator.vibrate(25);
  }

  // slowly grow face
  face.style.width =
    (150 + catches*8)+"px";

  face.style.height =
    (150 + catches*8)+"px";

  if(catches >= 5){

    finishGame();

  }else{

    moveFace();
  }
}

// finish game
function finishGame(){

  gameFinished = true;

  subtitle.innerHTML =
    "Mwaaaahhh... 🤍";

  reaction.innerHTML = "";

  face.style.left = "50%";
  face.style.top = "50%";

  face.style.transform =
    "translate(-50%, -50%)";

  face.classList.add("final-face");

  document.body.classList.add("dark-romantic");

  setTimeout(()=>{
    message.classList.add("show");
  },700);

  setTimeout(()=>{
    holdArea.classList.add("show");
  },1400);

  if(navigator.vibrate){
    navigator.vibrate(100);
  }
}

// HOLD TO KISS

function startHeartbeat(){

  heartbeatInterval = setInterval(()=>{

    document.body.style.transform = "scale(1.01)";

    setTimeout(()=>{
      document.body.style.transform = "scale(1)";
    },180);

    if(navigator.vibrate){
      navigator.vibrate(12);
    }

  },800);
}

function stopHeartbeat(){
  clearInterval(heartbeatInterval);
}

function startHold(){

  holdValue = 0;

  startHeartbeat();

  holdInterval = setInterval(()=>{

    holdValue += 2;

    holdFill.style.width =
      holdValue+"%";

    face.style.transform =
      `translate(-50%, -50%) scale(${1 + holdValue/180})`;

    if(holdValue >= 100){

      clearInterval(holdInterval);

      finalKiss();
    }

  },40);
}

function stopHold(){

  clearInterval(holdInterval);

  stopHeartbeat();

  if(holdValue < 100){

    holdValue = 0;

    holdFill.style.width = "0%";

    face.style.transform =
      "translate(-50%, -50%) scale(1.03)";

    reaction.innerHTML =
      "awh come back 😭";

    setTimeout(()=>{
      reaction.innerHTML = "";
    },1200);
  }
}

function finalKiss(){

  stopHeartbeat();

  subtitle.innerHTML =
    "Mwaaaaaahhh 💋";

  message.innerHTML =
    "I miss you, ponnu... 🤍<br><br>" +
    "So until I can kiss you for real,<br>" +
    "you'll have to keep this one.<br><br>" +
    "Now give the phone a tiny kiss 😚";

  document.body.style.background =
    "radial-gradient(circle at center,#ffd1df 0%,#c96b97 50%,#5f2746 100%)";

  // slow sparkles
  setInterval(createSparkle,500);

  if(navigator.vibrate){
    navigator.vibrate([80,40,80]);
  }
}

holdBtn.addEventListener("mousedown", startHold);
holdBtn.addEventListener("mouseup", stopHold);
holdBtn.addEventListener("mouseleave", stopHold);

holdBtn.addEventListener("touchstart", startHold);
holdBtn.addEventListener("touchend", stopHold);

</script>

</body>
</html>
