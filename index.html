<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<!-- subtle title -->
<title>🤍</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
}

body{
  height:100vh;
  overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:linear-gradient(160deg,#c96c9d,#f7a8c0,#ffd9e5);
  display:flex;
  justify-content:center;
  align-items:center;
  color:white;
  position:relative;
  transition:background 1s ease;
}

.container{
  width:100%;
  max-width:420px;
  text-align:center;
  z-index:2;
  padding:20px;
}

h1{
  font-size:2.5rem;
  margin-bottom:12px;
  text-shadow:0 0 15px rgba(255,255,255,0.25);
}

.subtitle{
  font-size:1.1rem;
  opacity:0.95;
  margin-bottom:20px;
  min-height:38px;
}

.center-area{
  position:relative;
  height:320px;
  display:flex;
  justify-content:center;
  align-items:center;
}

.face{
  position:absolute;
  width:150px;
  height:150px;
  border-radius:25px;
  object-fit:contain;
  border:3px solid rgba(255,255,255,0.7);
  box-shadow:0 0 25px rgba(255,255,255,0.25);
  transition:all 0.9s ease;
}

.face.final{
  width:260px;
  height:260px;
  transform:scale(1.03);
  box-shadow:0 0 55px rgba(255,255,255,0.4);
}

.kiss-btn{
  margin-top:10px;
  padding:15px 28px;
  border:none;
  border-radius:40px;
  background:rgba(255,255,255,0.18);
  backdrop-filter:blur(10px);
  color:white;
  font-size:1rem;
  transition:0.3s ease;
}

.kiss-btn:active{
  transform:scale(0.95);
}

.kiss-btn.hidden{
  opacity:0;
  pointer-events:none;
}

.message{
  margin-top:22px;
  font-size:1rem;
  line-height:1.6;
  opacity:0;
  transform:translateY(10px);
  transition:all 1.2s ease;
}

.message.show{
  opacity:1;
  transform:translateY(0);
}

.reaction{
  height:28px;
  margin-top:10px;
  opacity:0.95;
  font-size:1rem;
  transition:0.3s;
}

.heart{
  position:absolute;
  font-size:18px;
  animation:float 7s linear infinite;
  opacity:0.65;
}

@keyframes float{
  0%{
    transform:translateY(100vh);
    opacity:0;
  }
  50%{
    opacity:1;
  }
  100%{
    transform:translateY(-10vh);
    opacity:0;
  }
}

/* kiss pop */
.kiss{
  position:absolute;
  font-size:32px;
  animation:kissPop 1s ease forwards;
  cursor:pointer;
}

@keyframes kissPop{
  0%{
    transform:scale(0.3);
    opacity:0;
  }
  40%{
    opacity:1;
  }
  100%{
    transform:scale(1.2);
    opacity:0;
  }
}

/* love meter */
.meter-wrap{
  width:220px;
  height:10px;
  background:rgba(255,255,255,0.2);
  border-radius:20px;
  margin:12px auto 0;
  overflow:hidden;
}

.meter{
  width:0%;
  height:100%;
  background:white;
  border-radius:20px;
  transition:0.4s ease;
}
</style>
</head>

<body>

<div class="container">

  <h1>Ammuuuu 💋</h1>

  <div class="subtitle" id="subtitle">
    Catch my kisses 😚
  </div>

  <div class="reaction" id="reaction"></div>

  <div class="meter-wrap">
    <div class="meter" id="meter"></div>
  </div>

  <div class="center-area">

    <img
      src="kiss.png"
      id="face"
      class="face"
    />

  </div>

  <button class="kiss-btn" id="btn" onclick="startGame()">
    Start 💋
  </button>

  <div class="message" id="message">
    Mwaaaahhh 💋🤍<br><br>
    I miss you, ponnu…<br>
    So I’m sending you kisses until I can give you one for real.
  </div>

</div>

<script>

const face = document.getElementById("face");
const meter = document.getElementById("meter");
const reaction = document.getElementById("reaction");
const subtitle = document.getElementById("subtitle");
const msg = document.getElementById("message");
const btn = document.getElementById("btn");

let running = false;
let score = 0;

const reactions = [
  "hehe 😚",
  "you caught one 💋",
  "again again 🤍",
  "closer... 😳",
  "ponnuuuu 🫶",
  "mwaaaah 💋"
];

// floating hearts
function createHeart(){
  const heart = document.createElement("div");
  heart.classList.add("heart");
  heart.innerHTML = "🤍";

  heart.style.left = Math.random()*100+"vw";
  heart.style.animationDuration = (4+Math.random()*4)+"s";

  document.body.appendChild(heart);

  setTimeout(()=>heart.remove(),8000);
}
setInterval(createHeart,500);

// move face
function randomMove(){
  const x = Math.random()*220 - 110;
  const y = Math.random()*160 - 80;

  face.style.transform =
    `translate(${x}px, ${y}px) rotate(${Math.random()*16-8}deg)`;
}

// create kiss
function createKiss(){

  const kiss = document.createElement("div");
  kiss.classList.add("kiss");
  kiss.innerHTML = "💋";

  kiss.style.left =
    (Math.random()*(window.innerWidth-60))+"px";

  kiss.style.top =
    (Math.random()*(window.innerHeight-120))+"px";

  document.body.appendChild(kiss);

  kiss.onclick = () => {

    score++;

    meter.style.width = (score*20)+"%";

    reaction.innerHTML =
      reactions[Math.floor(Math.random()*reactions.length)];

    kiss.remove();

    if(navigator.vibrate){
      navigator.vibrate(35);
    }

    // tiny face bounce
    face.style.transform += " scale(1.08)";

    setTimeout(()=>{
      randomMove();
    },120);

    // final moment
    if(score >= 5){
      finishScene();
    }
  };

  setTimeout(()=>{
    kiss.remove();
  },2200);
}

function startGame(){

  if(running) return;
  running = true;

  btn.classList.add("hidden");

  subtitle.innerHTML =
    "Catch them before they disappear 😚";

  if(navigator.vibrate){
    navigator.vibrate([40,50,40]);
  }

  randomMove();

  const interval = setInterval(()=>{

    createKiss();
    randomMove();

    if(score >= 5){
      clearInterval(interval);
    }

  },700);
}

function finishScene(){

  document.body.style.background =
    "linear-gradient(160deg,#9b4d74,#d989ab,#ffdce7)";

  subtitle.innerHTML = "Mwaaaahhh... 🤍";

  reaction.innerHTML = "";

  face.style.transform = "translate(0,0)";
  face.classList.add("final");

  msg.classList.add("show");

  if(navigator.vibrate){
    navigator.vibrate(120);
  }
}
</script>

</body>
</html>
