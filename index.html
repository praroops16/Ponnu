<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Kiss for Ammu 💋</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
}

body{
  height:100vh;
  overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:linear-gradient(160deg,#3a0f4b,#ff8fb1,#ffd6e0);
  display:flex;
  justify-content:center;
  align-items:center;
  color:white;
  position:relative;
}

.container{
  width:100%;
  max-width:420px;
  text-align:center;
  z-index:2;
  padding:20px;
}

h1{
  font-size:2.4rem;
  margin-bottom:12px;
  text-shadow:0 0 15px rgba(255,255,255,0.35);
}

.subtitle{
  font-size:1.1rem;
  opacity:0.92;
  margin-bottom:25px;
  min-height:40px;
}

.center-area{
  position:relative;
  height:320px;
  display:flex;
  justify-content:center;
  align-items:center;
}

.face{
  position:absolute;
  width:110px;
  height:110px;
  border-radius:50%;
  object-fit:cover;
  border:3px solid rgba(255,255,255,0.7);
  box-shadow:0 0 25px rgba(255,255,255,0.25);
  transition:all 1.2s ease;
}

/* Final centered pose */
.face.final{
  width:210px;
  height:210px;
  transform:scale(1.08);
  box-shadow:0 0 45px rgba(255,255,255,0.45);
}

.kiss-btn{
  margin-top:10px;
  padding:15px 28px;
  border:none;
  border-radius:40px;
  background:rgba(255,255,255,0.18);
  backdrop-filter:blur(10px);
  color:white;
  font-size:1rem;
  transition:0.3s ease;
}

.kiss-btn:active{
  transform:scale(0.96);
}

.message{
  margin-top:20px;
  font-size:1rem;
  line-height:1.6;
  opacity:0;
  transition:opacity 1s ease;
}

.message.show{
  opacity:1;
}

.heart{
  position:absolute;
  font-size:18px;
  animation:float 7s linear infinite;
  opacity:0.7;
}

@keyframes float{
  0%{
    transform:translateY(100vh);
    opacity:0;
  }
  50%{
    opacity:1;
  }
  100%{
    transform:translateY(-10vh);
    opacity:0;
  }
}

.kiss{
  position:absolute;
  font-size:28px;
  animation:kissPop 1s ease forwards;
}

@keyframes kissPop{
  0%{
    transform:scale(0.2);
    opacity:0;
  }
  50%{
    transform:scale(1.3);
    opacity:1;
  }
  100%{
    transform:scale(1);
    opacity:0;
  }
}
</style>
</head>

<body>

<div class="container">

  <h1>Ammuuuu 💋</h1>

  <div class="subtitle" id="subtitle">
    Tap below and catch my kiss 🤍
  </div>

  <div class="center-area" id="area">

    <img
      src="Kiss.png"
      id="face"
      class="face"
    />

  </div>

  <button class="kiss-btn" onclick="startKiss()">
    Kiss me 💋
  </button>

  <div class="message" id="message">
    Mwaaaahhh 💋🤍<br><br>
    I miss you, ponnu…<br>
    So I’m sending you kisses until I can give you one for real.
  </div>

</div>

<script>

const face = document.getElementById("face");
const area = document.getElementById("area");
const msg = document.getElementById("message");
const subtitle = document.getElementById("subtitle");

let running = false;

// Floating hearts
function createHeart(){
  const heart = document.createElement("div");
  heart.classList.add("heart");
  heart.innerHTML = "🤍";

  heart.style.left = Math.random()*100+"vw";
  heart.style.animationDuration = (4+Math.random()*4)+"s";

  document.body.appendChild(heart);

  setTimeout(()=>heart.remove(),8000);
}
setInterval(createHeart,500);

function randomPos(){
  const x = Math.random()*220 - 110;
  const y = Math.random()*180 - 90;

  face.style.transform =
    `translate(${x}px, ${y}px) rotate(${Math.random()*20-10}deg)`;
}

function kissBurst(){
  const kiss = document.createElement("div");
  kiss.classList.add("kiss");
  kiss.innerHTML = "💋";

  kiss.style.left = (window.innerWidth/2 - 10 + (Math.random()*120-60)) + "px";
  kiss.style.top = (window.innerHeight/2 - 10 + (Math.random()*120-60)) + "px";

  document.body.appendChild(kiss);

  setTimeout(()=>kiss.remove(),1000);
}

function startKiss(){

  if(running) return;
  running = true;

  subtitle.innerHTML = "Catching my kiss... 💋";

  // vibration
  if(navigator.vibrate){
    navigator.vibrate([40,60,40]);
  }

  let moves = 0;

  const interval = setInterval(()=>{

    randomPos();
    kissBurst();

    moves++;

    if(moves >= 8){

      clearInterval(interval);

      setTimeout(()=>{

        face.style.transform = "translate(0,0)";
        face.classList.add("final");

        subtitle.innerHTML = "Mwaaaahhh...! 🤍";

        msg.classList.add("show");

        if(navigator.vibrate){
          navigator.vibrate(120);
        }

      },500);
    }

  },350);
}
</script>

</body>
</html>
